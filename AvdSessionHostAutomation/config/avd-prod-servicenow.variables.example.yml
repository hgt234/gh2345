# Create an Azure DevOps variable group named avd-prod-servicenow. It is only
# loaded when a build is queued with a RITM sys_id, so technician-started
# builds work before this group exists.
# OAuth client credentials is the production method: populate SN_CLIENT_ID and
# SN_CLIENT_SECRET and leave the Basic pair empty. Define the unused pair as
# empty values. Mark SN_CLIENT_SECRET and SN_PASSWORD as secret.
variables:
  SN_INSTANCE_URL: https://example.service-now.com
  SN_CLIENT_ID: replace-me
  SN_CLIENT_SECRET: replace-me-and-mark-secret
  SN_USERNAME: ''
  SN_PASSWORD: ''
  SN_STATUS_FIELD: u_avd_build_status
  SN_HOSTNAME_FIELD: u_avd_hostname
